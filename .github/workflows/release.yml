name: Build & Release SSM-GUI

on:
  push:
    tags:
      - 'v*'
  # Manual release from the Actions tab: builds the selected branch and
  # creates the tag v<version> on that commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.7.0'
        required: true

jobs:
  build_on_linux_amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: version
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev libusb-1.0-0-dev libavformat-dev libavcodec-dev libavutil-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd gui/frontend
          npm install
          npm run build

      - name: Build
        run: |
          go build -ldflags "-X main.SSM_VERSION=$VERSION" -o ssm-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-linux-${{ steps.version.outputs.version }}-amd64
          path: ./ssm-gui

  build_on_linux_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: version
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev libusb-1.0-0-dev libavformat-dev libavcodec-dev libavutil-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd gui/frontend
          npm install
          npm run build

      - name: Build
        run: |
          go build -ldflags "-X main.SSM_VERSION=$VERSION" -o ssm-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-linux-${{ steps.version.outputs.version }}-arm64
          path: ./ssm-gui

  build_on_windows_amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        shell: pwsh
        run: |
          cd gui/frontend
          npm install
          npm run build

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:MSYSTEM = "MINGW64"
          # The first -Syu may only update the core runtime and exit, so run it twice.
          C:\msys64\usr\bin\bash -lc "pacman --noconfirm -Syu"
          C:\msys64\usr\bin\bash -lc "pacman --noconfirm -Syu"
          C:\msys64\usr\bin\bash -lc "pacman --noconfirm -S --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libusb mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-ntldd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          C:\msys64\usr\bin\bash -lc "pkg-config --exists libusb-1.0 libavformat libavcodec libavutil"
          if ($LASTEXITCODE -ne 0) { Write-Error "pkg-config cannot find libusb/ffmpeg"; exit 1 }

      - name: Build
        env:
          PKG_CONFIG_PATH: C:\msys64\mingw64\lib\pkgconfig;C:\msys64\mingw64\share\pkgconfig
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go build -ldflags "-X main.SSM_VERSION=$env:VERSION" -o ssm-gui.exe

      - name: Copy exe and dlls
        shell: bash
        run: |
          mkdir build
          cp ./ssm-gui.exe ./build/
          for dll in $(/c/msys64/mingw64/bin/ntldd.exe -R ./ssm-gui.exe | awk '{ if ($3 ~ /^C:\\msys64/) print $3; }'); do
            cp -v $dll ./build/
          done

      - name: Upload Artifact (Full)
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-windows-${{ steps.version.outputs.version }}-full-amd64
          path: ./build/

      - name: Upload Artifact (Executable only)
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-windows-${{ steps.version.outputs.version }}-exe-only-amd64
          path: ./ssm-gui.exe

  build_on_macos_amd64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          brew install ffmpeg libusb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd gui/frontend
          npm install
          npm run build

      - name: Build
        run: |
          go build -ldflags "-X main.SSM_VERSION=$VERSION" -o ssm-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-darwin-${{ steps.version.outputs.version }}-amd64
          path: ./ssm-gui

  build_on_macos_arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        id: version
        shell: bash
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          brew install ffmpeg libusb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd gui/frontend
          npm install
          npm run build

      - name: Build
        run: |
          go build -ldflags "-X main.SSM_VERSION=$VERSION" -o ssm-gui

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssm-gui-darwin-${{ steps.version.outputs.version }}-arm64
          path: ./ssm-gui

  github_release:
    runs-on: ubuntu-22.04
    needs:
      - build_on_linux_amd64
      - build_on_linux_arm64
      - build_on_windows_amd64
      - build_on_macos_amd64
      - build_on_macos_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Version
        shell: bash
        run: |
          version=$(echo "${{ inputs.version || github.ref_name }}" | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/

      - name: Compress Artifacts
        shell: bash
        run: |
          cd builds
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Generate changelog
        shell: bash
        run: |
          # Prefer the hand-written, user-facing section from CHANGELOG.md.
          notes=$(awk -v tag="## [$VERSION]" 'index($0, tag) == 1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md 2>/dev/null || true)
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > RELEASE_NOTES.md
          else
            # Fallback: build a list from the commit log since the previous tag.
            prev=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
            {
              echo "## Changes"
              echo
              if [ -n "$prev" ]; then
                git log --no-merges --pretty='- %s' "$prev..v$VERSION"
                echo
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev...v$VERSION"
              else
                git log --no-merges --pretty='- %s' "v$VERSION"
              fi
            } > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            builds/*.zip